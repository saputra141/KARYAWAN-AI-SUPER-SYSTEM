
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar | Karyawan AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eef5ff;font-family:system-ui}
.card{width:min(92%,430px);padding:30px;border:1px solid #24364d;border-radius:22px;background:#101d30;box-shadow:0 20px 60px #0005}
.logo{font-size:35px;font-weight:900;color:#58a6ff;text-align:center}
h1{text-align:center;margin:8px 0}
p{text-align:center;color:#9eb2ca}
input,button{width:100%;padding:15px;margin-top:13px;border-radius:12px;font-size:16px}
input{background:#081426;color:white;border:1px solid #2b405b}
button{border:0;background:linear-gradient(135deg,#1677ff,#00b7d4);color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
a{color:#61b5ff;text-decoration:none}
.footer{text-align:center;margin-top:20px}
#msg{font-size:14px;margin-top:15px;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<div class="logo">KAI</div>
<h1>Buat Akun Baru</h1>
<p>Daftar KARYAWAN AI SUPER SYSTEM</p>
<form id="registerForm">
<input id="name" type="text" placeholder="Nama lengkap" required autocomplete="name">
<input id="email" type="email" placeholder="Email" required autocomplete="email">
<input id="password" type="password" placeholder="Password (minimal 6 karakter)" required minlength="6" autocomplete="new-password">
<input id="confirm" type="password" placeholder="Ulangi password" required minlength="6" autocomplete="new-password">
<button id="btn" type="submit">DAFTAR</button>
</form>
<div id="msg"></div>
<div class="footer">Sudah punya akun? <a href="login.html">Login</a></div>
<div class="footer"><a href="index.html">← Kembali ke beranda</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="backend.js"></script>
<script>
const form=document.getElementById("registerForm");
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");
form.addEventListener("submit",async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent="Membuat akun...";
 msg.textContent="";
 if(password.value!==confirm.value){
  msg.style.color="#ff8585";msg.textContent="Password dan konfirmasi tidak sama.";
  btn.disabled=false;btn.textContent="DAFTAR";return;
 }
 try{
  await window.registerUser(name.value.trim(),email.value.trim(),password.value);
  msg.style.color="#66e6a5";
  msg.textContent="Pendaftaran berhasil. Jika diminta, cek email untuk verifikasi. Silakan login.";
  form.reset();
 }catch(err){
  msg.style.color="#ff8585";msg.textContent=err.message||"Pendaftaran gagal.";
 }finally{btn.disabled=false;btn.textContent="DAFTAR";}
});
</script>
</body>
</html>
